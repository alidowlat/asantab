<div class="grow overflow-y-auto">
    <ul class="divide-y">
        <li class="pb-5 pt-6">
            <div class="flex justify-center relative cursor-pointer">
                <input placeholder="جست و جو مقاله..."
                       type="text"
                       name="search-filter"
                       class="w-64 border rounded-lg bg-background px-4 py-2.5 outline-none duration-300 placeholder:duration-300 focus:placeholder:-translate-x-2">
            </div>
        </li>
        {#categories#}
        <li>
            <div class="relative rounded-lg bg-muted" data-accordion-item="">
                <button type="button" class="w-full px-4 py-5 text-right md:px-6 md:py-5"
                        data-accordion-button="">
                    <div class="flex items-center justify-between gap-2 text-sm md:text-base">
                        <span> دسته بندی ها </span>
                        <div class="min-w-fit">
                            <span class="i-lucide-chevron-left duration-300"
                                  data-accordion-chevron=""></span>
                        </div>
                    </div>
                </button>
                <div class="relative max-h-0 overflow-hidden transition-all duration-300"
                     data-accordion-content="">
                    <ul data-search-items="" class="max-h-40 space-y-2 overflow-y-auto py-3">
                        {% for category in categories %}
                            <li>
                                <div class="inline-flex w-full items-center">
                                    <label class="flex w-full cursor-pointer items-center gap-4 px-4 py-2"
                                           for="checkbox-category-{{ forloop.counter }}" data-ripple-dark="true">
                                        <div class="relative flex items-center">
                                            <input value="{{ category.slug }}" name="category-filter" type="checkbox"
                                                   class="before:content[''] peer relative h-5 w-5 cursor-pointer appearance-none rounded-md border transition-all before:absolute before:left-2/4 before:top-2/4 before:block before:h-12 before:w-12 before:-translate-x-2/4 before:-translate-y-2/4 before:rounded-full before:opacity-0 before:transition-opacity checked:border-primary-btn checked:bg-primary-btn checked:before:bg-primary-btn hover:before:opacity-10"
                                                   id="checkbox-category-{{ forloop.counter }}">
                                            <div class="pointer-events-none absolute left-2/4 top-2/4 -translate-x-2/4 -translate-y-2/4 text-white opacity-0 transition-opacity peer-checked:opacity-100">
                                                <div class="i-lucide-check h-4 w-4 stroke-2"></div>
                                            </div>
                                        </div>
                                        <div class="flex w-full items-center justify-between">
                                            <span data-searchable=""> {{ category.title }} </span>
                                        </div>
                                    </label>
                                </div>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </li>
        {#tags#}
        <li>
            <div class="relative rounded-lg bg-muted" data-accordion-item="">
                <button type="button" class="w-full px-4 py-5 text-right md:px-6 md:py-5"
                        data-accordion-button="">
                    <div class="flex items-center justify-between gap-2 text-sm md:text-base">
                        <span> تگ ها </span>
                        <div class="min-w-fit">
                                                                <span class="i-lucide-chevron-left duration-300"
                                                                      data-accordion-chevron=""></span>
                        </div>
                    </div>
                </button>
                <div class="relative max-h-0 overflow-hidden transition-all duration-300"
                     data-accordion-content="">
                    <div data-search-item-input-wrapper="" class="mb-4 px-4">
                        <input class="w-full rounded-lg border bg-transparent px-4 py-2 outline-none duration-300 placeholder:duration-300 focus:border-primary focus:placeholder:-translate-x-2"
                               type="text" placeholder="جستجوی تگ ها ...">
                    </div>
                    <ul data-search-items="" class="max-h-40 space-y-2 overflow-y-auto py-3">
                        {% for tag in tags %}
                            <li>
                                <div class="inline-flex w-full items-center">
                                    <label class="flex w-full cursor-pointer items-center gap-4 px-4 py-2"
                                           for="checkbox-tags-{{ forloop.counter }}" data-ripple-dark="true">
                                        <div class="relative flex items-center">
                                            <input value="{{ tag.slug }}" name="tags-filter" type="checkbox"
                                                   class="before:content[''] peer relative h-5 w-5 cursor-pointer appearance-none rounded-md border transition-all before:absolute before:left-2/4 before:top-2/4 before:block before:h-12 before:w-12 before:-translate-x-2/4 before:-translate-y-2/4 before:rounded-full before:opacity-0 before:transition-opacity checked:border-primary-btn checked:bg-primary-btn checked:before:bg-primary-btn hover:before:opacity-10"
                                                   id="checkbox-tags-{{ forloop.counter }}">
                                            <div class="pointer-events-none absolute left-2/4 top-2/4 -translate-x-2/4 -translate-y-2/4 text-white opacity-0 transition-opacity peer-checked:opacity-100">
                                                <div class="i-lucide-check h-4 w-4 stroke-2"></div>
                                            </div>
                                        </div>
                                        <div class="flex w-full items-center justify-between">
                                            <span data-searchable=""> {{ tag.title }} </span>
                                        </div>
                                    </label>
                                </div>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </li>
    </ul>
</div>

<div class="p-4">
    <button type="button" id="apply-filters-btn" data-drawer-hide="filter-drawer"
            class="btn-primary w-full py-2">
        اعمال فیلتر
    </button>
</div>
