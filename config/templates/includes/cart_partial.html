{% load extra_filters %}
{% if cart and cart.items.exists  %}
    {% for item in cart.items.all %}
        {% include 'includes/cart_item.html' with item=item %}
    {% endfor %}
    <!-- footer -->
    <div class="flex items-center justify-between border-t p-4">
        <div class="flex flex-col items-center">
            <p class="text-text/60">مبلغ قابل پرداخت</p>
            <div class="flex items-center gap-x-1 text-primary">
                <p class="text-lg font-bold">{{ final_price|rounded|three_digits }}</p>
                <p class="text-sm">تومان</p>
            </div>
        </div>
        <a href="{% url 'order_checkout_page' %}">
            <button class="w-32 rounded-md bg-primary-btn py-3 text-white duration-200 hover:bg-primary-btn/80">
                ثبت سفارش
            </button>
        </a>
    </div>
{% else %}
    <div class="text-center text-gray-400 text-sm py-2">موردی یافت نشد.</div>
{% endif %}
