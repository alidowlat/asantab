{% if recent_withdrawals %}
    <div class="border-border/20 relative border overflow-x-auto overflow-y-auto hidden lg:block md:block sm:block">
        <table class="text-text w-full text-right text-sm">
            <thead class="text-text/70 bg-background text-xs uppercase sticky top-0">
            <tr>
                <th scope="col" class="px-6 py-3">تاریخ</th>
                <th scope="col" class="px-6 py-3">وضعیت</th>
                <th scope="col" class="px-6 py-3">مبلغ (تومان)</th>
                <th scope="col" class="px-6 py-3">توضیح</th>
            </tr>
            </thead>
            <tbody id="transaction-rows">
            {% for wdr in recent_withdrawals %}
                {% include 'wallet/withdraw/desktop/item.html' %}
            {% endfor %}
            </tbody>
        </table>
    </div>
{% else %}
    <div class="flex justify-center items-center">
        <img class="w-60 pb-10" src="/static/images/empty/empty-cart.svg" alt="empty page picture">
    </div>
    <div class="text-center text-gray-400 text-lg pb-4">درحال حاضر تراکنشی ندارید.</div>
{% endif %}

<!-- Pagination -->
{% include 'includes/pagination.html' %}

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener("click", (e) => {
        const link = e.target.closest("#pagination a");
        if (!link) return;

        e.preventDefault();
        const url = link.getAttribute("href");

        Swal.fire({
            title: "لطفاً صبر کنید...",
            text: "در حال بارگذاری تراکنش‌ها",
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });

        fetch(url, {headers: {"x-requested-with": "XMLHttpRequest"}})
            .then(res => res.json())
            .then(data => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.html, "text/html");

                document.getElementById("transaction-rows").innerHTML =
                    doc.querySelector("#transaction-rows").innerHTML;

                document.getElementById("pagination").innerHTML =
                    doc.querySelector("#pagination").innerHTML;

                Swal.close();
            })
            .catch(() => {
                Swal.fire("خطا!", "مشکلی در بارگذاری داده‌ها رخ داد.", "error");
            });
    });
</script>
