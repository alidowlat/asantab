    <div class="absolute left-2 top-2">
        <button onclick="toggleDark(event)" class="icon-btn h-10 w-10">
            <i class="i-carbon-moon !h-6 !w-6 dark:i-carbon-sun"></i>
        </button>
    </div>

    <div class="z-10 w-full py-10 xs:container">
        <div class="relative mx-auto bg-muted px-4 py-8 xs:max-w-[440px] xs:rounded-xl lg:px-10 lg:py-12">
            <a href="{% url 'auth_page' %}"
               class="absolute right-2 top-2 flex size-10 items-center justify-center rounded-full border bg-background text-primary duration-300 hover:bg-primary-btn hover:text-background xs:-right-2 xs:-top-2">
                <i class="i-carbon-chevron-right size-7 stroke-2"></i>
            </a>
            <form class="flex flex-col" method="post" action="">
                {% csrf_token %}
                <a href="{% url 'index_page' %}" class="mb-10">
                    <img src="/static/images/logo.png" alt="logo" class="mx-auto h-10 xs:h-12">
                </a>

                <h1 class="mb-8 text-center font-medium xs:text-lg">
                    کد تایید را وارد کنید
                </h1>

                <div class="mb-4 w-full space-y-6">
                    <div id="otp-form" class="flex items-center justify-between gap-x-2" dir="ltr">
                        {% for i in "12345" %}
                            <input type="text" inputmode="numeric" maxlength="1"
                                   class="otp-input h-14 w-14 rounded-lg border bg-muted text-center text-lg outline-none xs:h-16 xs:w-16 md:text-xl"
                                   autocomplete="one-time-code">
                        {% endfor %}
                        <input type="hidden" name="otp" id="otp-hidden">
                    </div>
                    {% for error in form.otp.errors %}
                        <div class="flex">
                            <i class="i-lucide-circle-alert text-warning ml-2"></i>
                            <div class="text-warning text-sm">{{ error }}</div>
                        </div>
                    {% endfor %}
                </div>
                <ul class="mb-6 space-y-4">
                    <li>
                        <p class="text-sm text-primary/60" id="countdownSection">
                            زمان باقی‌مانده تا ارسال مجدد
                            <span id="countdown" class="font-bold">2:00</span>
                        </p>
                        <button id="resendButton" onclick="resendOTP()" class="hidden text-sm text-primary">
                            <span> ارسال مجدد کد تایید </span>
                            <span>
                                <svg class="h-5 w-5">
                                  <use xlink:href="#chevron-left"></use>
                                </svg>
                            </span>
                        </button>
                    </li>
                </ul>

                <button type="submit" class="btn-primary py-3">
                    تایید
                </button>
            </form>
        </div>
    </div>
</div>
<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");

            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();

                if (cookie.substring(0, name.length + 1) === name + "=") {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }


    let countdownMinutes = 2;
    let countdownSeconds = 0;
    let countdownInterval;

    function updateCountdown() {
        const countdownElement = document.getElementById("countdown");
        countdownElement.textContent = `${countdownMinutes}:${countdownSeconds
            .toString()
            .padStart(2, "0")}`;
    }

    function startCountdown() {
        countdownInterval = setInterval(function () {
            if (countdownMinutes === 0 && countdownSeconds === 0) {
                clearInterval(countdownInterval);
                document.getElementById("resendButton").classList.remove("hidden");
                document.getElementById("resendButton").disabled = false;
                document.getElementById("countdownSection").classList.add("hidden");
            } else {
                if (countdownSeconds === 0) {
                    countdownMinutes--;
                    countdownSeconds = 59;
                } else {
                    countdownSeconds--;
                }
                updateCountdown();
            }
        }, 1000);
    }

    function resendOTP() {
        if (countdownMinutes != 0 || countdownSeconds != 0) return;

        fetch("/auth/user/resend-otp/", {
            method: "POST",
            headers: {
                "X-CSRFToken": getCookie("csrftoken"),
            },
        }).then((response) => {
            if (!response.ok) throw new Error("Failed to resend OTP");
            return response.json();
        })
            .then((data) => {
                if (data.status === "ok") {
                    inputs.forEach((input) => {
                        input.value = "";
                        toggleFilledClass(input);
                    });
                    hiddenInput.value = "";
                    inputs[0].focus();

                    countdownMinutes = 2;
                    countdownSeconds = 0;
                    updateCountdown();
                    startCountdown();

                    document.getElementById("resendButton").classList.add("hidden");
                    document.getElementById("resendButton").disabled = true;
                    document.getElementById("countdownSection").classList.remove("hidden");
                }
            })
            .catch((error) => {
                console.error("Error:", error);
            });
    }

    startCountdown(); // Start the countdown when the page loads

    const form = document.querySelector("#otp-form");
    const hiddenInput = document.getElementById('otp-hidden');
    const inputs = document.querySelectorAll(".otp-input");

    inputs[0].focus();
    const isAllInputFilled = () => {
        return Array.from(inputs).every((item) => item.value);

    };

    function faToEnDigits(str) {
        return str.replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
    }

    inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
            input.value = faToEnDigits(input.value);
            input.value = input.value.replace(/\D/g, '').slice(0, 1);
            if (input.value && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }

            const code = Array.from(inputs).map(i => i.value).join('');
            hiddenInput.value = code;

            if (isAllInputFilled()) {
                form.closest('form').submit();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
                inputs[index - 1].focus();
            }
        });
    });

    function updateHiddenInput() {
        hiddenInput.value = Array.from(inputs).map(input => input.value).join('');
    }

    function getOTP() {
        const values = Array.from(document.querySelectorAll('.otp-input')).map(i => i.value);
        return values.join('');
    }

    function isValidOTP() {
        const otp = getOTP();
        return /^\d{5}$/.test(otp);
    }

    const toggleFilledClass = (field) => {
        if (field.value) {
            field.classList.add("!border-primary");
        } else {
            field.classList.remove("!border-primary");
        }
    };

    form.addEventListener("input", (e) => {
        const target = e.target;
        const value = target.value;

        if (!/^\d$/.test(value)) {
            target.value = ""; // Allow only single digits
            return;
        }

        toggleFilledClass(target);

        if (target.nextElementSibling && value) {
            target.nextElementSibling.focus();
        }

        if (isAllInputFilled()) {
            tryAutoSubmit(); // Call alert every time all inputs are filled
        }
    });

    inputs.forEach((input, currentIndex) => {
        toggleFilledClass(input);

        input.addEventListener("paste", (e) => {
            e.preventDefault();
            const text = e.clipboardData
                .getData("text")
                .replace(/\D/g, "")
                .slice(0, inputs.length - currentIndex);

            inputs.forEach((item, index) => {
                if (index >= currentIndex && text[index - currentIndex]) {
                    item.focus();
                    item.value = text[index - currentIndex];
                    toggleFilledClass(item);
                }
            });
        });

        input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" || e.key === "Delete") {
                e.preventDefault();
                input.value = "";
                toggleFilledClass(input);
                if (input.previousElementSibling) {
                    input.previousElementSibling.focus();
                }
            }
        });

        input.addEventListener("input", () => {
            if (input.value.length > 1) {
                input.value = input.value.slice(-1); // Keep only the last digit
            }
        });
    });

    function tryAutoSubmit() {
        if (isAllInputFilled()) {
            hiddenInput.value = getOTP();
            form.submit();
        }
    }
</script>


</body>
</html>
