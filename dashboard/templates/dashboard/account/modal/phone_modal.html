{% load widget_tweaks %}
<div
        id="phone-modal"
        class="field-modal fixed left-0 right-0 top-0 z-50 hidden h-[calc(100%-1rem)] max-h-full w-full overflow-y-auto overflow-x-hidden p-4 md:inset-0"
        data-field="phone_number"
        data-url="{% url 'update_phone' %}"
>
    <div class="relative max-h-full w-full max-w-md">
        <div class="overflow-hidden rounded-lg border bg-muted shadow">
            <!-- Header -->
            <div class="px-4 py-5 sm:px-6">
                <div class="flex items-center justify-between">
                    <h3 class="md:text-lg">تغییر شماره موبایل</h3>
                    <button
                            class="text-text/60 duration-300 hover:text-text/95"
                            data-modal-hide="phone-modal"
                            type="button"
                    >
                        <div class="i-lucide-x size-6"></div>
                        <span class="sr-only">بستن</span>
                    </button>
                </div>
            </div>

            <!-- Content -->
            <div class="space-y-6 px-4 py-5 sm:p-6">
                {% if not request.user.phone_number %}
                    <form class="space-y-6 w-full" novalidate>
                        {% csrf_token %}
                        <div class="space-y-3">
                            <label dir="ltr"
                                   for="{{ phone_form.phone_number.id_for_label }}"
                                   class="relative block w-full rounded-lg border bg-muted shadow-sm duration-300 focus-within:border-primary"
                            >
                                {{ phone_form.phone_number|add_class:"modal-input peer w-full rounded-lg bg-transparent p-2 placeholder-transparent outline-none focus:ring-0 xs:px-4 xs:py-3" }}
                                <span dir="rtl"
                                      class="pointer-events-none absolute start-3 -translate-y-1/2 rounded-full bg-muted px-2 text-base text-text/80 transition-all duration-200"
                                >
                                شماره موبایل
                            </span>
                            </label>
                            <div class="flex">
                                <i class="hidden i-lucide-circle-alert text-warning ml-2"></i>
                                <p class="error-text h-5 text-sm text-warning">
                                    {% if phone_form.phone_number.errors %}{{ phone_form.phone_number.errors.0 }}{% endif %}
                                </p>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div class="flex justify-end gap-4">
                            <button
                                    type="button"
                                    class="submit-btn btn-primary w-full rounded-lg px-4 py-2 md:w-auto"
                            >
                                ویرایش
                            </button>
                        </div>
                    </form>
                {% else %}
                    <div class="space-y-8 w-full">
                        <div class="space-y-3">
                            <div class="flex justify-center">
                                <p class="error-text h-5 text-lg text-center">آیا مایل به تغییر شماره موبایل خود هستید ؟</p>
                            </div>
                        </div>
                        <p class="border border-t"></p>
                        <div class="flex justify-center gap-4">
                            <a href="{% url 'change_phone_number_page' %}"
                               class="submit-btn btn-primary w-full rounded-lg px-4 py-2 md:w-auto">
                                بله
                            </a>
                            <button data-modal-hide="phone-modal"
                               class="submit-btn btn-warning w-full rounded-lg px-4 py-2 md:w-auto">
                                خیر
                            </button>
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
