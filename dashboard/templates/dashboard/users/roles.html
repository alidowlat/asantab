{% extends 'dashboard/_layout.html' %}
{% load extra_filters %}


{% block title %}
    لیست نقش ها | آسان تب
{% endblock %}

{% block content %}
    <div class="rounded-lg bg-muted shadow">
        <div class="py-5">
            <div class="mb-16 flex justify-center px-5">
                <h1 class="relative w-fit font-medium lg:text-lg">
                    نقش های آسان تب
                    <span class="absolute right-0 top-10 h-[3px] w-full animate-fill-border rounded-full bg-primary"></span>
                </h1>
            </div>
            <div class="rounded-lg bg-muted p-4">
                <div class="flex overflow-auto lg:overflow-visible grid grid-cols-3 gap-4">
                    <div>
                        <a href="{% url 'user_list_manager' %}"
                           class="bg-cyan-500 flex flex-col items-center justify-center gap-4 rounded-lg px-4 py-6">
                            <div class="i-lucide-user-round block size-18"></div>
                            <p class="text-lg">لیست کاربران</p>
                        </a>
                    </div>
                    <div>
                        <a href="{% url 'provider_list_manager' %}"
                           class=" bg-orange-500 flex flex-col items-center justify-center gap-4 rounded-lg px-4 py-6">
                            <div class="flex">
                                <svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                     class="lucide lucide-package-plus-icon lucide-package-plus">
                                    <path d="M16 16h6"/>
                                    <path d="M19 13v6"/>
                                    <path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/>
                                    <path d="m7.5 4.27 9 5.15"/>
                                    <polyline points="3.29 7 12 12 20.71 7"/>
                                    <line x1="12" x2="12" y1="22" y2="12"/>
                                </svg>
                                <div class="i-lucide-user-round block size-18"></div>
                            </div>
                            <p class="text-lg">لیست فروشندگان</p>
                        </a>
                    </div>
                    <div>
                        <a href="{% url 'user_list_manager' %}"
                           class="bg-green-500 flex flex-col items-center justify-center gap-4 rounded-lg px-4 py-6">
                            <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 class="lucide lucide-crown-icon lucide-crown">
                                <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/>
                                <path d="M5 21h14"/>
                            </svg>
                            <p class="text-lg">لیست مدیران و کارشناسان</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
