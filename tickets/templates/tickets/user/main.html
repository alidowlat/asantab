{% extends 'dashboard/_layout.html' %}

{% block title %}
    آسان تب | تیکت ها
{% endblock %}

{% block content %}
    <div class="rounded-lg bg-muted p-4 shadow-sm dark:bg-mut sm:p-6">
        <!-- Page Header -->
        <div class="mb-6 flex flex-col items-start justify-between gap-y-4 border-b border-gray-200 pb-4 dark:border-gray-600 sm:flex-row sm:items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800 dark:text-white">تیکت های پشتیبانی</h1>
                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">لیست تمام گفتگوهای شما با تیم پشتیبانی.</p>
            </div>
            <a href="{% url 'user_ticket_create' %}"
               class="inline-flex items-center justify-center gap-x-2 rounded-lg btn-primary px-4 py-2 text-sm font-medium text-white shadow-sm focus:outline-none focus:ring-4 focus:ring-primary/50">
                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 12h8"></path>
                    <path d="M12 8v8"></path>
                </svg>
                <span>تیکت جدید</span>
            </a>
        </div>

        <!-- Tickets List -->
        <div class="space-y-4">
            {% include 'tickets/user/list.html' %}
        </div>

        <!-- Pagination -->
        {% include 'includes/pagination.html' %}
    </div>
{% endblock %}
